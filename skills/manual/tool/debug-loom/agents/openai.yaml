display_name: Debug Loom
short_description: Weave services × modes into a repeatable local debug stack — debug.sh, orchestrator, centralized logs, doctor diagnostics.
default_prompt: Create or improve this project's debug-loom — inventory services and modes, generate per-service debug.sh, scaffold scripts/debug-loom (start/stop/status/logs/doctor), and centralize logs under .var/debug-loom/current/.
